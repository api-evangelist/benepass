aid: benepass
name: Benepass
description: >-
  Benepass is a financial-technology platform for flexible, compliant employee
  benefits — one platform and one card covering pre-tax accounts (HSA, FSA, HRA),
  Lifestyle Spending Accounts (LSAs), and programs for wellness, professional
  development, family care, food, and commuter benefits. Benepass integrates with
  employer HRIS and payroll systems (via API, SFTP, and Workday RaaS) to automate
  benefit enrollment, contributions, and deductions for global, distributed teams.
  Benepass does not currently publish a public developer API; this profile
  captures its public trust, security, and company surface.
